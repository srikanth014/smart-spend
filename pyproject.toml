[project]
name = "smartspend-mcp-server"
version = "0.1.0"
description = "A SmartSpend expense tracking MCP server with FastMCP, SQLite, and LangChain AI agent integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.8",
    "langchain[mcp]>=1.5.0",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "streamlit>=1.49",
    "plotly>=5.24",
]

[project.scripts]
smartspend-server = "mcp_server.server:main"
smartspend-client = "mcp_server.client:main"
smartspend-agent = "mcp_server.langchain_client:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_server"
